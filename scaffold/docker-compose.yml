services:
  {{slug}}:
    build: .
    ports:
      - "8000:8000"
    environment:
      STORAGE_DIR: /store
      PORT: 8000
      # The versions of the map live here.
      DATABASE_URL: postgres://{{slug}}:{{slug}}@postgres:5432/{{slug}}
      # Who may edit and publish, by the email they sign in with. Everyone else
      # sees the published map. Empty, or with sign-in off as here, everyone
      # may edit.
      OWNER_EMAILS: ""
      # Sign-in is off in this stack. Drop these three and set AUTH_TENANT_ID,
      # AUTH_CLIENT_ID, AUTH_CLIENT_SECRET and AUTH_SESSION_SECRET for Entra ID.
      AUTH_ENABLED: "false"
      NODE_ENV: development
      AUTH_DEV_BYPASS: "true"
      # The model behind the Assistant, taken from the shell that runs compose so
      # that no key is written here. Both, or the Assistant writes prompts to
      # copy into a chat of your own. ASSISTANT_MODEL and ASSISTANT_API_STYLE
      # (openai | anthropic) are optional.
      ASSISTANT_API_URL: ${ASSISTANT_API_URL:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_API_STYLE: ${ASSISTANT_API_STYLE:-}
    # Icons, the logo and the settings are files under one folder, so one volume
    # holds all of them. The versions are in Postgres.
    volumes:
      - {{slug}}-data:/store/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Published on 5432 as well, so `npm run start:dev` on the host can use it:
  # `npm run db`, then `npm run start:dev`.
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: {{slug}}
      POSTGRES_PASSWORD: {{slug}}
      POSTGRES_DB: {{slug}}
    volumes:
      - {{slug}}-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{slug}} -d {{slug}}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  {{slug}}-data:
  {{slug}}-db:
